spring:
  application:
    name: redis-stream
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

openai:
  api-key: ${OPENAI_API_KEY:}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com}
  model: gpt-5.6-luna
  reasoning: low

redis-stream:
  worker:
    group: llm-workers
    block-timeout: 1s
    consumer-name: worker-local
    poll-delay: 1000
